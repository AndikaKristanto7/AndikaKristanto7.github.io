<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andika Kristanto — Software Engineer</title>
    <meta
      name="description"
      content="Andika Kristanto, Software Engineer (Fullstack, backend-focused) with 9+ years building multi-tenant web platforms on AWS across fintech and agritech."
    />
    <meta property="og:title" content="Andika Kristanto — Software Engineer" />
    <meta
      property="og:description"
      content="Fullstack, backend-focused engineer building secure, multi-tenant platforms on AWS."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      ;(function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
